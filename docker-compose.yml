services:
  db:
    image: pgvector/pgvector:pg16        # PostgreSQL 16 with the pgvector extension preinstalled
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: codeagent
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d codeagent"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env                      # copy .env.example to .env first
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/codeagent   # chunks, metadata and vectors live in PostgreSQL
    volumes: ["agent-data:/data"]       # working copies of imported repositories + experiment results
    depends_on:
      db:
        condition: service_healthy
volumes:
  agent-data:
  pgdata:
