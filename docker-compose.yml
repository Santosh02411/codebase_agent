services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["agent-data:/data"]
  # Not wired into the app yet (Phase 7 / P7.2): PostgreSQL with pgvector for chunks + embeddings.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: codeagent
    ports: ["5432:5432"]
    profiles: ["phase7"]
volumes:
  agent-data:
