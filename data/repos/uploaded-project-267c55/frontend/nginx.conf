server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path nginx can't find as a real static file
    # (e.g. a deep link the app handles client-side) falls back to
    # index.html so the React app's own routing/view logic takes over,
    # instead of nginx returning a bare 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get a long cache lifetime — Vite fingerprints
    # built filenames with a content hash, so a NEW deploy naturally
    # gets new filenames instead of needing this cache invalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
