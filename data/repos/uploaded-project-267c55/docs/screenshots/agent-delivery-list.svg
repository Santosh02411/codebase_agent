<svg viewBox="0 0 420 700" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="420" height="700" fill="#0b0e14"/>

  <!-- status bar -->
  <rect x="0" y="0" width="420" height="8" fill="#0b0e14"/>

  <!-- header -->
  <text x="24" y="50" fill="#e8eaed" font-size="20" font-weight="700">My Deliveries</text>
  <rect x="340" y="30" width="56" height="26" rx="13" fill="rgba(61,214,140,0.15)"/>
  <circle cx="352" cy="43" r="4" fill="#3dd68c"/>
  <text x="374" y="47" text-anchor="middle" fill="#3dd68c" font-size="10" font-weight="600">Online</text>

  <text x="24" y="80" fill="#8b93a3" font-size="12">8 deliveries assigned today</text>

  <!-- Delivery card 1 -->
  <rect x="20" y="102" width="380" height="128" rx="10" fill="#141821" stroke="#2a3140"/>
  <text x="40" y="130" fill="#e8eaed" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">ORD-4471</text>
  <rect x="320" y="116" width="70" height="22" rx="11" fill="rgba(79,163,247,0.15)"/>
  <text x="355" y="131" text-anchor="middle" fill="#4fa3f7" font-size="11">Picked Up</text>
  <text x="40" y="156" fill="#8b93a3" font-size="12">42 MG Road, Belagavi</text>
  <text x="40" y="176" fill="#8b93a3" font-size="12">Expected by 4:30 PM · Zone B</text>
  <rect x="40" y="192" width="150" height="30" rx="6" fill="#f2a93b"/>
  <text x="115" y="212" text-anchor="middle" fill="#14100a" font-size="12" font-weight="700">Mark Delivered</text>
  <rect x="200" y="192" width="90" height="30" rx="6" fill="none" stroke="#384056"/>
  <text x="245" y="212" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">Scan</text>

  <!-- Delivery card 2 -->
  <rect x="20" y="246" width="380" height="128" rx="10" fill="#141821" stroke="#2a3140"/>
  <text x="40" y="274" fill="#e8eaed" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">ORD-4474</text>
  <rect x="320" y="260" width="70" height="22" rx="11" fill="rgba(242,169,59,0.15)"/>
  <text x="355" y="275" text-anchor="middle" fill="#f2a93b" font-size="11">Assigned</text>
  <text x="40" y="300" fill="#8b93a3" font-size="12">17 Camp Road, Belagavi</text>
  <text x="40" y="320" fill="#8b93a3" font-size="12">Expected by 5:15 PM · Zone B</text>
  <rect x="40" y="336" width="150" height="30" rx="6" fill="#f2a93b"/>
  <text x="115" y="356" text-anchor="middle" fill="#14100a" font-size="12" font-weight="700">Mark Delivered</text>
  <rect x="200" y="336" width="90" height="30" rx="6" fill="none" stroke="#384056"/>
  <text x="245" y="356" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">Scan</text>

  <!-- offline banner -->
  <rect x="20" y="392" width="380" height="40" rx="8" fill="rgba(242,169,59,0.1)" stroke="#f2a93b" stroke-dasharray="3,3"/>
  <text x="210" y="417" text-anchor="middle" fill="#f2a93b" font-size="11" font-weight="600">Working offline — 2 updates queued to sync</text>

  <!-- Delivery card 3 -->
  <rect x="20" y="450" width="380" height="128" rx="10" fill="#141821" stroke="#2a3140"/>
  <text x="40" y="478" fill="#e8eaed" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">ORD-4480</text>
  <rect x="320" y="464" width="70" height="22" rx="11" fill="rgba(61,214,140,0.15)"/>
  <text x="355" y="479" text-anchor="middle" fill="#3dd68c" font-size="11">Delivered</text>
  <text x="40" y="504" fill="#8b93a3" font-size="12">9 Ramtirth Nagar, Belagavi</text>
  <text x="40" y="524" fill="#8b93a3" font-size="12">Delivered at 1:05 PM · Zone A</text>

  <!-- bottom nav -->
  <rect x="0" y="640" width="420" height="60" fill="#141821"/>
  <text x="90" y="675" text-anchor="middle" fill="#f2a93b" font-size="11" font-weight="600">Deliveries</text>
  <text x="210" y="675" text-anchor="middle" fill="#8b93a3" font-size="11">Performance</text>
  <text x="330" y="675" text-anchor="middle" fill="#8b93a3" font-size="11">Account</text>

  <text x="210" y="616" text-anchor="middle" fill="#384056" font-size="10">Illustrative mockup — not a real screenshot</text>
</svg>
