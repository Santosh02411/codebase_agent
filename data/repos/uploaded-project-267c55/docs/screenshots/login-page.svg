<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="900" height="620" fill="#0b0e14"/>

  <!-- Wordmark -->
  <text x="450" y="70" text-anchor="middle" fill="#f2a93b" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">Delivery Sync</text>
  <text x="450" y="96" text-anchor="middle" fill="#5a6272" font-size="13">Fleet operations console</text>

  <!-- Card -->
  <rect x="270" y="130" width="360" height="440" rx="14" fill="#141821" stroke="#2a3140"/>

  <!-- Account type toggle -->
  <rect x="298" y="160" width="304" height="36" rx="8" fill="#0f1319" stroke="#2a3140"/>
  <rect x="298" y="160" width="152" height="36" rx="8" fill="#f2a93b"/>
  <text x="374" y="183" text-anchor="middle" fill="#14100a" font-size="13" font-weight="600">Staff</text>
  <text x="526" y="183" text-anchor="middle" fill="#8b93a3" font-size="13" font-weight="600">Customer</text>

  <!-- Username field -->
  <text x="298" y="228" fill="#8b93a3" font-size="12">Username</text>
  <rect x="298" y="236" width="304" height="38" rx="6" fill="#0f1319" stroke="#2a3140"/>
  <text x="312" y="260" fill="#5a6272" font-size="13">admin</text>

  <!-- Password field -->
  <text x="298" y="296" fill="#8b93a3" font-size="12">Password</text>
  <rect x="298" y="304" width="304" height="38" rx="6" fill="#0f1319" stroke="#2a3140"/>
  <text x="312" y="328" fill="#5a6272" font-size="13">••••••••••</text>
  <!-- eye icon -->
  <circle cx="580" cy="323" r="9" fill="none" stroke="#5a6272" stroke-width="1.5"/>
  <circle cx="580" cy="323" r="3" fill="#5a6272"/>

  <text x="602" y="366" text-anchor="end" fill="#f2a93b" font-size="12" font-weight="600">Forgot password?</text>

  <!-- Log in button -->
  <rect x="298" y="382" width="304" height="42" rx="8" fill="#f2a93b"/>
  <text x="450" y="408" text-anchor="middle" fill="#14100a" font-size="14" font-weight="700">Log in</text>

  <!-- divider -->
  <line x1="298" y1="446" x2="405" y2="446" stroke="#2a3140"/>
  <text x="450" y="450" text-anchor="middle" fill="#5a6272" font-size="11">or</text>
  <line x1="495" y1="446" x2="602" y2="446" stroke="#2a3140"/>

  <!-- Google button -->
  <rect x="298" y="464" width="304" height="42" rx="8" fill="#141821" stroke="#384056"/>
  <circle cx="332" cy="485" r="9" fill="#f2a93b"/>
  <path d="M328 481 h8 M332 477 v8" stroke="#14100a" stroke-width="2"/>
  <text x="460" y="490" text-anchor="middle" fill="#e8eaed" font-size="13" font-weight="600">Sign in with Google</text>

  <text x="450" y="546" text-anchor="middle" fill="#8b93a3" font-size="12">Don't have an account? <tspan fill="#f2a93b" font-weight="600">Sign up</tspan></text>

  <text x="450" y="600" text-anchor="middle" fill="#384056" font-size="11">Illustrative mockup — not a real screenshot</text>
</svg>
